<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>PokéFollower</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    /* Card sizing + paddings (wider so SPEED fits comfortably) */
    body {
      margin: 0;
      padding-top: 64px;         /* give space below top band/notch */
      padding-bottom: 60px;      /* give space above bottom band text */
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      min-width: 360px;
      max-width: 380px;
      font-size: 14px;
      position: relative;
      background: #fff;
      color: #000;
    }

    /* Top red band with black line */
    body::before {
      content: "";
      position: absolute; left: 0; right: 0; top: 0;
      height: 28px;
      background: #EF4036;
      border-bottom: 6px solid #000;
    }
    /* Bottom red band with black line */
    body::after {
      content: "";
      position: absolute; left: 0; right: 0; bottom: 0;
      height: 36px;
      background: #EF4036;
      border-top: 5px solid #000;
      z-index: 0;
    }

    /* Half Pokéball notch (outer + inner ring) */
    .notch {
      position: absolute; top: 6px; left: 50%;
      transform: translateX(-50%);
      width: 27px; height: 27px;
      background: #fff;
      border: 10px solid #000; border-radius: 50%;
      box-sizing: content-box;
    }
    .notch::after {
      content: ""; position: absolute;
      width: 20px; height: 21px;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      background: #fff; border: 1px solid #000; border-radius: 50%;
    }

    /* Header row: brand left, enable toggle right */
    .header {
      position: relative;
      height: 26px;
      display: grid; grid-template-columns: 1fr auto; align-items: center;
      margin-top: -25px;         /* visually closer to black line */
      padding: 0 14px;           /* spacing from edges */
      background: transparent; border: 0;
    }
    .brand { 
      font-weight: 600; font-style: normal; font-size: 12px; letter-spacing: .05em;
    }
    .enable {
      font-weight: 600; font-size: 12px;
      display: inline-grid; grid-auto-flow: column; align-items: center; gap: 6px;
    }

    /* Turn the checkbox into the Pokéball toggle */
    #enabled {
      appearance: none; -webkit-appearance: none;
      width: 36px; height: 18px;
      border: 1.5px solid #000; border-radius: 18px;
      background: #fff; position: relative; display: inline-block; cursor: pointer; outline: none;
    }
    /* switch knob (mini Pokéball) */
    #enabled::after {
      content: "";
      position: absolute; top: 50%; left: -4px; transform: translateY(-50%);
      width: 18px; height: 18px; border-radius: 50%;
      border: 2px solid #000; background: linear-gradient(to bottom, #EF4036 50%, #fff 50%);
    }
    /* ON state */
    #enabled:checked { background: #EF4036; }
    #enabled:checked::after { left: calc(100% - 18px); }

    /* Language segment toggle (EN | 한글); #mode reuses the same .langOpt pattern */
    .langRow { display: flex; justify-content: flex-end; padding: 0 14px; margin-top: 2px; }
    #lang, #mode { display: inline-flex; border: 1.5px solid #000; border-radius: 8px; overflow: hidden; }
    #lang .langOpt, #mode .langOpt {
      appearance: none; -webkit-appearance: none; border: 0; background: #fff; color: #000;
      font-weight: 800; font-size: 11px; line-height: 1.5; padding: 2px 10px; cursor: pointer; outline: none;
    }
    #lang .langOpt + .langOpt, #mode .langOpt + .langOpt { border-left: 1.5px solid #000; }
    #lang .langOpt[aria-pressed="true"], #mode .langOpt[aria-pressed="true"] { background: #EF4036; color: #fff; }
    #lang .langOpt:focus-visible, #mode .langOpt:focus-visible { outline: 2px solid #000; outline-offset: -2px; }

    /* Card body */
    .card { padding: 10px 16px 0; }

    /* Preview block with chevrons */
    .preview {
      display: grid;
      grid-template-columns: auto auto auto;
      align-items: center;
      justify-content: center;
      column-gap: 26px;
      margin: 5px auto 0;
      width: max-content;
      max-width: 100%;
    }
    .chev { inline-size: 0; block-size: 0; border: 12px solid transparent; cursor: pointer; }
    .preview .chev.left  { justify-self: end;  border-right-color: #000; }
    .preview .chev.right { justify-self: start; border-left-color:  #000; }

    #previewSprite {
      display: block; margin: 0 auto;
      image-rendering: pixelated;
      width: 150px; height: 150px;       /* scaled up from 96px */
      transform: scaleX(-1);             /* face right */
    }

    /* Search-like select */
    .picker {
      margin: 8px auto; width: 240px;
      display: flex; align-items: center; justify-content: center;
      border: 1.5px solid #000; border-radius: 8px; padding: 8px 12px;
      position: relative; background: #fff;
    }
    .picker .glass {
      position: absolute; left: 18px; top: 50%; transform: translateY(-50%);
      width: 18px; height: 18px; border: 0; background: none; padding: 0;
      appearance: none; -webkit-appearance: none;
      cursor: pointer; z-index: 2;
    }
    .picker .glass img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }
    .picker .glass:focus-visible {
      outline: 2px solid #000;
      outline-offset: 2px;
    }
    #pack, #packSearch {
      appearance: none; border: 0; padding: 0 44px; margin: 0; width: 100%;
      background: transparent; font-weight: 800; font-size: 14px; outline: none;
      text-align: center; text-align-last: center; -moz-text-align-last: center;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      flex: 1; min-width: 0;
    }
    #packSearch {
      display: none;
      border: 0;
      background: transparent;
      font-weight: 800;
      font-size: 14px;
      text-align: center;
      outline: none;
      width: 100%;
    }
    #packSearch::placeholder { color: rgba(0, 0, 0, 0.4); }
    #packSearch.no-match { color: #c62828; }
    .picker.searching #pack { display: none; }
    .picker.searching #packSearch { display: block; }
    .picker datalist { display: none; }
    .shuffle {
      position: absolute; right: 18px; top: 50%; transform: translateY(-50%);
      width: 26px; height: 26px; border: 0; background: none; padding: 0;
      display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer; z-index: 2;
    }
    .shuffle:focus-visible {
      outline: 2px solid #000;
      border-radius: 50%;
      outline-offset: 1px;
    }
    .shuffleIcon {
      display: block;
      width: 20px;
      height: 20px;
      object-fit: contain;
    }

    /* Growth: level + XP progress toward next evolution */
    .growth { margin: 6px auto 0; width: 240px; }
    .growthRow {
      display: flex; justify-content: space-between; align-items: center;
      font-weight: 800; font-size: 12px; margin-bottom: 4px;
    }
    .growthLeft { display: inline-flex; align-items: center; gap: 6px; }
    /* Small "current mood" portrait -- shown only if the selected Pokémon has
       a Normal portrait downloaded (see assets/portraits/); hidden otherwise. */
    #moodPreview {
      display: none;
      width: 20px; height: 20px;
      border-radius: 50%;
      border: 1.5px solid #000;
      object-fit: cover;
      image-rendering: pixelated;
    }
    #evolveHint { font-weight: 700; font-size: 11px; opacity: 0.75; }
    .xpBarTrack {
      height: 10px; border: 1.5px solid #000; border-radius: 6px;
      background: #fff; overflow: hidden;
    }
    .xpBarFill { height: 100%; width: 0%; background: #EF4036; }

    /* Hunger: simple gauge + Feed button (Phase 3) -- deliberately kept at
       the same "emoji + small readout" level as the rest of this panel, no
       separate bar/animation system. */
    .hungerRow {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 6px; font-weight: 800; font-size: 12px;
    }
    .hungerLeft { display: inline-flex; align-items: center; gap: 4px; }
    #feedBtn {
      border: 1.5px solid #000; border-radius: 6px; background: #fff;
      font-weight: 700; font-size: 11px; padding: 4px 10px; cursor: pointer;
    }
    #feedBtn:hover { background: #EF4036; color: #fff; }
    #feedBtn:disabled { opacity: 0.5; cursor: default; background: #fff; color: inherit; }

    /* Branch evolution choice (e.g. Eevee) -- hidden unless pending */
    .evolveChoice {
      margin: 8px auto 0; width: 240px; text-align: center;
      border: 1.5px solid #000; border-radius: 8px; padding: 8px;
      background: #fff;
    }
    .evolveChoiceLabel { font-weight: 800; font-size: 11px; margin-bottom: 6px; }
    .evolveChoiceButtons { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
    .evolveChoiceButtons button {
      border: 1.5px solid #000; border-radius: 6px; background: #fff;
      font-weight: 700; font-size: 11px; padding: 4px 8px; cursor: pointer;
    }
    .evolveChoiceButtons button:hover { background: #EF4036; color: #fff; }

    /* Controls layout: three columns */
    .triples { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; text-align: center; margin-top: 6px; }
    .triple h4 { font-size: 12px; letter-spacing: .02em; margin: 8px 0 8px; font-weight: 800; }

    /* Row: vertical arrows + underline input */
    .controlRow { display: flex; align-items: flex-start; justify-content: center; gap: 10px; }
    .arrowStack { display: flex; flex-direction: column; align-items: center; line-height: 0; }
    .arrowStack .caret { width: 0; height: 0; border: 7px solid transparent; }
    .arrowStack .caret.up   { border-bottom-color: #000; margin-bottom: 1px; } /* ▲ */
    .arrowStack .caret.down { border-top-color:     #000; }                   /* ▼ */

    .inputWrap { display: inline-flex; align-items: flex-start; gap: 6px; margin-top: -1px; }
    .inputWrap input[type="number"] {
      width: 28px; text-align: center; border: 0; border-bottom: 2px solid #000; outline: none;
      font-size: 14px; font-weight: 600; padding: 2px 0 0; background: transparent;
    }
    .inputWrap .suffix { font-weight: 700; display: inline-block; margin-top: 7px; }

    .inputWrap input[type="number"]::-webkit-outer-spin-button,
    .inputWrap input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

    /* Bottom hint text over red band */
    .hint {
      position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%);
      color: #fff; font-weight: 600; margin: 0; font-size: 10px; text-align: center;
      z-index: 2; pointer-events: auto; white-space: normal; font-style: italic;
      width: calc(100% - 12px); line-height: 1.6;
    }
    .hint-credits {
      opacity: 0.55;
    }
    .hint a {
      color: inherit;
    }
    .hint-links {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      width: fit-content;
      margin: 0 auto;
      opacity: 0.95;
    }

    /* Accessibility helper */
    .sr-only {
      position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 1px, 1px); white-space: nowrap; border: 0;
    }
  </style>
</head>
<body>
  <!-- Pokéball notch -->
  <div class="notch" aria-hidden="true"></div>

  <!-- Header -->
  <div class="header">
    <div class="brand">PokeFollower v4.0</div>
    <label class="enable" for="enabled">
      <span>Enable Follower</span>
      <input id="enabled" type="checkbox" />
    </label>
  </div>

  <!-- Language toggle -->
  <div class="langRow">
    <div id="lang" role="group" aria-label="Language">
      <button type="button" class="langOpt" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" class="langOpt" data-lang="ko" aria-pressed="false">한글</button>
    </div>
  </div>

  <!-- Mode toggle: follow the cursor, or wander the screen autonomously -->
  <div class="langRow">
    <div id="mode" role="group" aria-label="Mode">
      <button type="button" class="langOpt" data-mode="follow" aria-pressed="true">Follow</button>
      <button type="button" class="langOpt" data-mode="wander" aria-pressed="false">Wander</button>
    </div>
  </div>

  <div class="card">
    <!-- Preview with chevrons -->
    <div class="preview">
      <div class="chev left"  title="Previous"></div>
      <img id="previewSprite" src="../assets/ui/gen-1/009-blastoise.png" alt="Preview sprite" />
      <div class="chev right" title="Next"></div>
    </div>

    <!-- Search-like pack selector -->
    <div class="picker">
      <button type="button" class="glass" aria-label="Search Pokémon">
        <img src="../assets/ui/buttons/magnifying-glass.png" alt="" aria-hidden="true" />
      </button>
      <select id="pack" aria-label="Pokémon">
        <option value="retro/gen-1/009-blastoise">Blastoise (#009)</option>
        <option value="retro/gen-1/006-charizard">Charizard (#006)</option>
      </select>
      <input id="packSearch" class="searchInput" type="text" inputmode="search" autocomplete="off" list="packSuggestions" placeholder="Search name or #" aria-label="Search Pokémon" />
      <datalist id="packSuggestions"></datalist>
      <button type="button" class="shuffle" aria-label="Shuffle Pokémon">
        <span class="sr-only">Shuffle Pokémon</span>
        <img class="shuffleIcon" src="../assets/ui/buttons/shuffle-icon.png" alt="" aria-hidden="true" />
      </button>
    </div>

    <!-- Growth: level + XP progress toward next evolution -->
    <div class="growth">
      <div class="growthRow">
        <span class="growthLeft">
          <img id="moodPreview" alt="" />
          <span id="levelLabel">Lv. 1</span>
        </span>
        <span id="evolveHint"></span>
      </div>
      <div class="xpBarTrack"><div class="xpBarFill" id="xpBarFill"></div></div>
      <div class="hungerRow">
        <span class="hungerLeft">
          <span id="hungerEmoji" aria-hidden="true">🍎</span>
          <span id="hungerLabel">Hunger: 0%</span>
        </span>
        <button type="button" id="feedBtn">Feed</button>
      </div>
    </div>

    <!-- Branch evolution choice (e.g. Eevee) -- hidden unless pending -->
    <div class="evolveChoice" id="evolveChoice" hidden>
      <div class="evolveChoiceLabel" id="evolveChoiceLabel">Choose evolution:</div>
      <div class="evolveChoiceButtons" id="evolveChoiceButtons"></div>
    </div>

    <!-- Triple controls -->
    <div class="triples">
      <div class="triple">
        <h4>SCALE</h4>
        <div class="controlRow">
          <div class="arrowStack" aria-hidden="true">
            <div class="caret up"></div>
            <div class="caret down"></div>
          </div>
          <div class="inputWrap">
            <input id="scale" type="number" min="0.5" max="5.0" step="0.05" inputmode="decimal" />
            <span class="suffix">x</span>
          </div>
        </div>
        <span id="scaleVal" class="sr-only" aria-live="polite"></span>
      </div>

      <div class="triple">
        <h4>DISTANCE</h4>
        <div class="controlRow">
          <div class="arrowStack" aria-hidden="true">
            <div class="caret up"></div>
            <div class="caret down"></div>
          </div>
          <div class="inputWrap">
            <input id="offset" type="number" min="0" max="100" step="1" inputmode="numeric" />
            <span class="suffix">px</span>
          </div>
        </div>
        <span id="offsetVal" class="sr-only" aria-live="polite"></span>
      </div>

      <div class="triple">
        <h4>SPEED</h4>
        <div class="controlRow">
          <div class="arrowStack" aria-hidden="true">
            <div class="caret up"></div>
            <div class="caret down"></div>
          </div>
          <div class="inputWrap">
            <input id="lerp" type="number" min="0.5" max="5.0" step="0.1" inputmode="decimal" />
            <span class="suffix">spd</span>
          </div>
        </div>
        <span id="lerpVal" class="sr-only" aria-live="polite"></span>
      </div>
    </div>

    <!-- Bottom hint over red band -->
    <p class="hint">
      <span class="hint-credits">
        Sprite art & images provided by
        <a href="https://sprites.pmdcollab.org" target="_blank" rel="noreferrer noopener">PMD Collab</a>
        &amp;
        <a href="https://pokemondb.net" target="_blank" rel="noreferrer noopener">Pokémon DB</a>
      </span>
      <br />
      <span class="hint-links">
        <a
          href="https://github.com/namekun/pokefollower_cursor_web_plugin"
          target="_blank"
          rel="noreferrer noopener"
        >About / Updates</a>
        <a
          href="https://github.com/namekun/pokefollower_cursor_web_plugin/commits/main/"
          target="_blank"
          rel="noreferrer noopener"
        >Development Log</a>
      </span>
    </p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
